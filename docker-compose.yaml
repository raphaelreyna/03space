version: "3.9"

services:
  db:
    image: mysql:latest      # MySQL-compatible, small, GPL-friendly
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass      # ← change in .env or here
      MYSQL_DATABASE:   rimspace
      MYSQL_USER:       rimuser
      MYSQL_PASSWORD:   rimpass
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-u", "root", "-prootpass"]
      interval: 5s
      retries: 5
  
  migration:
    image: raphaelreyna/migrant
    environment:
      - CONN_STRING=rimuser:rimpass@tcp(db:3306)/rimspace
    volumes:
      - ./migrant.yaml:/migrant.yaml
      - ./migrant:/migrant
    depends_on:
      db:
        condition: service_healthy
  
  php:
    container_name: php
    build:
      dockerfile: Dockerfile.local
      context: .
    volumes:
      - ./:/var/www/html
    environment:
      - DB_HOST=db
      - DB_USERNAME=rimuser
      - DB_PASSWORD=rimpass
      - DB_NAME=rimspace
      - SITE_NAME="RimSpace-Dev"
      - DOMAIN_NAME="10.1.0.200:8081"
      - ADMIN_USER_ID=1
    depends_on:
      migration:
        condition: service_completed_successfully

  nginx:
    image: nginx:latest
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - .:/usr/share/nginx/html
      - ./example.nginx:/etc/nginx/conf.d/default.conf
    depends_on:
      - php

volumes:
  db_data: